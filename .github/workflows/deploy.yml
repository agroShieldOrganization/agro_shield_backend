name: Deploy Laravel to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            cd /var/www/html/agroshieldbackend

            echo "Forcing pull to clear any local server changes..."
            git fetch --all
            git reset --hard origin/main

            echo "Fixing folder ownership before running commands..."
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo find storage bootstrap/cache -type d -exec chmod 775 {} \;
            sudo find storage bootstrap/cache -type f -exec chmod 664 {} \;

            echo "Installing composer dependencies..."
            sudo -u www-data composer install --no-interaction --prefer-dist --optimize-autoloader

            echo "Running migrations..."
            sudo -u www-data php artisan migrate --force

            echo "Clearing and rebuilding Laravel caches..."
            sudo -u www-data php artisan optimize:clear
            sudo -u www-data php artisan config:cache
            sudo -u www-data php artisan route:cache
            sudo -u www-data php artisan view:cache

            echo "Restarting Apache..."
            sudo systemctl restart apache2

            echo "Deployment complete!"
